services:
  face:
    build: ./services/face
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      FACE_CTX_ID: "-1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
